<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-TqAdHb87tggobNVcoYLOB+upODQO8K/ssJWIVBiwGew='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="logo.png">
<title>NutriClarté</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NutriClarté — scan a product, get a clear nutrition score and healthier alternatives.">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centred app column (phone-first like the prototype), sticky brand bar with the FR/EN/ES toggle top-right, scrollable tab rail below. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface-2:#e9eff0; --line:#d8e1e2;
  --fg:#16263a; --muted:#5b6b7a;
  --navy:#17365d; --navy-fg:#ffffff; --leaf:#3f8f35; --water:#1f6fb2;
  --bad:#c0392b; --bad-bg:#fdecea; --warn:#b26a00; --good:#2e7d32; --good-bg:#e8f5e9; --ok:#1f6fb2;
  --shadow:0 1px 2px rgba(23,54,93,.06),0 4px 14px rgba(23,54,93,.06);
  /* System fonts only: no third-party font requests (privacy) */
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#17222e; --surface-2:#1f2d3b; --line:#2a3a4a;
  --fg:#e7eef4; --muted:#9aaaba; --navy:#3b6ea8; --navy-fg:#ffffff; --leaf:#6cbf5f; --water:#5aa6e6;
  --bad:#ff7b6b; --bad-bg:#3a1f1d; --warn:#f0b04a; --good:#7fd283; --good-bg:#1d3324; --ok:#5aa6e6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --surface-2:#1f2d3b; --line:#2a3a4a;
  --fg:#e7eef4; --muted:#9aaaba; --navy:#3b6ea8; --navy-fg:#ffffff; --leaf:#6cbf5f; --water:#5aa6e6;
  --bad:#ff7b6b; --bad-bg:#3a1f1d; --warn:#f0b04a; --good:#7fd283; --good-bg:#1d3324; --ok:#5aa6e6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
a{color:var(--water)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);min-width:0}
.brand img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff}
.brand b{font-family:var(--display);font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.brand b span{color:var(--navy);font-weight:700}
.lang{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px;flex-shrink:0}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:10px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--navy)}

main{padding-block:20px 40px}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--navy);color:var(--navy-fg);text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--navy)}
.btn.block{width:100%}
.btn.red{background:var(--bad);color:#fff}
.card.danger{display:flex;flex-direction:column;gap:10px;border-color:var(--bad)}

/* Home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.hero img{width:110px;height:auto;border-radius:16px;background:#fff}
.hero h1{font-size:2.1rem;font-weight:500;letter-spacing:-.02em}
.hero h1 span{font-weight:700;color:var(--navy)}
.hero p{font-style:italic;color:var(--muted)}
.goals h2{font-size:1.05rem;font-weight:600;display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.goals .sub{text-align:center;font-style:italic;color:var(--muted);font-size:.92rem}
.scanwrap{display:flex;justify-content:center;padding-block:12px}
.scanbtn{width:168px;height:168px;border-radius:50%;border:0;background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(23,54,93,.28);transition:transform .15s}
.scanbtn:hover{transform:scale(1.03)}
.scanbtn svg{width:46px;height:46px}
.center{display:flex;justify-content:center}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trust div{text-align:center;font-size:.85rem;color:var(--muted)}
.trust b{display:block;color:var(--fg);font-family:var(--display);font-size:1rem}
@media (max-width:480px){.trust{grid-template-columns:1fr}}

/* Scanner overlay */
.scanner{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;padding:24px}
.frame{width:min(260px,70vw);aspect-ratio:1.1;border:3px solid #fff;border-radius:18px;position:relative;overflow:hidden;max-width:100%}
.frame::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#6cbf5f;box-shadow:0 0 12px #6cbf5f;top:10%;animation:sweep 1.8s ease-in-out infinite alternate}
.frame .bars{position:absolute;inset:30% 18%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px,rgba(255,255,255,.55) 5px 6px,transparent 6px 10px);opacity:.5}
@keyframes sweep{to{top:88%}}
@media (prefers-reduced-motion:reduce){.frame::after{animation:none;top:50%}}
.scanner .sim{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer}
.scanner .cancel{background:none;border:0;color:#cfd8e0;cursor:pointer}

/* Result */
.filters{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.92rem;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg)}
.slider label{font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slider input{width:100%;accent-color:var(--water);margin-top:10px}
.score{display:flex;gap:16px;align-items:center}
.ring{width:76px;height:76px;flex-shrink:0;border-radius:50%;border:4px solid var(--rc);display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;font-weight:700;color:var(--rc)}
.score .pname{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.score .rating{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--rc)}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.alert{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:.95rem}
.alert.bad{color:var(--bad)} .alert.warn{color:var(--warn)} .alert.good{color:var(--good)}
.alert i{font-style:normal;flex-shrink:0;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:.75rem;color:#fff}
.alert.bad i{background:var(--bad)} .alert.warn i{background:var(--warn)} .alert.good i{background:var(--good)}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nutr b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.nutr span{font-size:.82rem;color:var(--muted)}
.nutr .over b{color:var(--bad)}
@media (max-width:420px){.nutr{grid-template-columns:repeat(2,1fr)}}
.alt{display:flex;flex-direction:column;gap:6px}
.alt .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.alt h3{font-family:var(--body);font-size:1.02rem;font-weight:700}
.pill{background:var(--good-bg);color:var(--good);font-weight:700;font-size:.82rem;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.alt .why{font-style:italic;color:var(--leaf);font-size:.92rem;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.match{font-size:.78rem;font-weight:700;color:var(--water)}

/* History */
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;font:inherit}
.hrow .ring{width:48px;height:48px;font-size:1.1rem;border-width:3px}
.hrow div{min-width:0;flex:1}
.hrow small{color:var(--muted)}
.ex{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:2px 6px;border-radius:4px;margin-left:6px}

/* FAQ / prose */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details+details{margin-top:8px}
summary{font-weight:700;cursor:pointer}
details p{margin-top:8px;color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.prose h1{font-size:1.9rem;font-weight:600}
.prose h2{font-size:1.25rem;font-weight:600;margin-top:10px}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.prose .lede{font-size:1.12rem;color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.grid2 h3{font-size:1.02rem;margin-bottom:4px}
.quote{border-left:4px solid var(--leaf);padding:4px 0 4px 14px;font-size:1.1rem;font-style:italic}
.updated{font-size:.88rem;color:var(--muted)}

/* Contact */
.contact{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.contact{grid-template-columns:1fr}}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:.93rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:130px;resize:vertical}
.field .err{color:var(--bad);font-size:.85rem;min-height:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:4px}
.phone{font-family:var(--display);font-size:1.5rem;font-weight:600;user-select:all;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px}
.side .card{display:flex;flex-direction:column;gap:6px}
.copy{align-self:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:600;cursor:pointer}
.success{display:flex;flex-direction:column;gap:8px;background:var(--good-bg);border:1px solid var(--good);border-radius:var(--r);padding:16px}
.success h3{color:var(--good)}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .row{display:flex;gap:10px;justify-content:flex-end}
.opts{display:flex;flex-wrap:wrap;gap:8px}
@media (min-width:640px){.modal{align-items:center}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:70;max-width:calc(100% - 32px)}

footer{border-top:1px solid var(--line);padding-block:20px;font-size:.88rem;color:var(--muted)}
footer .col{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:12px}
footer a{color:var(--muted)}
.demo-tag{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-weight:600}
</style>

</head>

  "page.about":`
<span class="eyebrow">About us</span>
<h1>Why we built NutriClarté</h1>
<p class="lede">NutriClarté started with a simple frustration: standing in a grocery aisle, holding two jars, and not being able to tell which one was actually better for the person you are shopping for.</p>
<h2>The story behind the app</h2>
<p>Nutrition labels are full of numbers, but they rarely answer the real question: <em>is this good for me?</em> A label says 55 g of sugar per 100 g. Is that a lot for someone managing diabetes? What if you only eat one spoonful? What if you also watch your cholesterol?</p>
<p>We watched people we love struggle with exactly these questions after a diagnosis. They were told to "eat better" and then left alone with tiny print, two languages on every package, and marketing claims like "light" or "natural" that mean very little.</p>
<p class="quote">We wanted a tool that turns a label into a clear answer in under five seconds, in the language you think in.</p>
<p>That became NutriClarté: scan a barcode, pick up to three goals, and see a score, plain-language alerts, and better alternatives from the same shelf.</p>
<h2>Who we are</h2>
<p>We are a small, independent team based in Québec, combining software development with a deep interest in nutrition and public health. We are not owned by a food company or a grocery chain, and we intend to keep it that way.</p>
<h2>Why you can trust us</h2>
<div class="grid2">
  <div class="card"><h3>Independent recommendations</h3><p class="muted">No brand can pay to improve its score or to appear as an alternative.</p></div>
  <div class="card"><h3>Public data sources</h3><p class="muted">Scores use the nutrition facts printed on the package and Health Canada daily values.</p></div>
  <div class="card"><h3>Privacy first</h3><p class="muted">Your goals, profile and history stay on your device. We do not sell data. Ever.</p></div>
  <div class="card"><h3>Reachable humans</h3><p class="muted">Call us or write to us. A person from the team answers, in French, English or Spanish.</p></div>
</div>
<h2>Our mission</h2>
<p><strong>La santé sans confusion. Wellness made simple.</strong> We want every shopper, whatever their health condition or language, to make a confident choice in the aisle.</p>
<p><a class="btn" href="#contact">Contact the team</a></p>`,
  "page.support":`
<span class="eyebrow">Support</span>
<h1>How can we help?</h1>
<p class="lede">Quick answers to the most common questions. If you are still stuck, our team is one message away.</p>
<h2>Getting started</h2>
<ol>
  <li>Choose up to 3 nutritional goals on the Analyze tab (for example Low-Sugar and Cardio).</li>
  <li>Tap <strong>Scan a product</strong> and place the barcode inside the frame.</li>
  <li>Read the score and alerts, then switch between <strong>Rigid Base (100g)</strong> and <strong>Real Portion</strong>.</li>
  <li>Move the slider to match how much you actually eat.</li>
  <li>Browse the <strong>Best Alternatives For You</strong> to find a better option.</li>
</ol>
<h2>Troubleshooting</h2>
<div class="grid2">
  <div class="card"><h3>The camera does not open</h3><p class="muted">Allow camera access for NutriClarté in your phone settings, then reopen the app.</p></div>
  <div class="card"><h3>Product not found</h3><p class="muted">Some local or new products are not in our database yet. Send us the barcode through the contact form and we will add it.</p></div>
  <div class="card"><h3>The score seems wrong</h3><p class="muted">Check whether you are in Real Portion mode. Then tell us the product name so we can review it.</p></div>
  <div class="card"><h3>Change the language</h3><p class="muted">Use the FR / EN / ES switch at the top right of any page. Your choice is remembered.</p></div>
</div>
<h2>Accounts and data</h2>
<p>NutriClarté works without an account. Your history and profile stay on your device. To erase all of it, use <strong>Delete all my data</strong> on the History tab. <strong>Clear history</strong> removes only your past scans.</p>
<h2>Still need help?</h2>
<p>Use our contact form or call us during business hours. We answer within 2 business days.</p>
<p><a class="btn" href="#contact">Contact support</a></p>`,
  "page.privacy":`
<span class="eyebrow">Privacy</span>
<h1>Privacy policy</h1>
<p class="updated">Last updated: November 1, 2026</p>
<p class="lede">Short version: your health goals are personal. We collect as little as possible, we keep it on your device whenever we can, and we never sell it.</p>
<h2>1. What we collect</h2>
<ul>
  <li><strong>On your device only:</strong> the goals you select, your advanced profile (age group, allergies) and your scan history.</li>
  <li><strong>When you scan:</strong> the barcode number, sent to our product database to fetch nutrition facts. It is not linked to your identity.</li>
  <li><strong>When you contact us:</strong> your name, email address and message, used only to answer you.</li>
</ul>
<h2>2. What we never do</h2>
<ul>
  <li>We do not sell, rent or trade personal information.</li>
  <li>We do not show advertising or share data with food brands.</li>
  <li>We do not collect your precise location or your contacts.</li>
  <li>We do not load third-party trackers, analytics or web fonts. The site only loads its own files.</li>
</ul>
<h2>3. Your rights</h2>
<p>Under Québec's Law 25 and Canada's PIPEDA, you can access, correct or delete the personal information we hold about you, and withdraw your consent. Send your request through the contact form and choose "Privacy or data request". We answer within 30 days.</p>
<h2>4. Retention and security</h2>
<p>Contact messages are kept for up to 24 months, then deleted. Data in transit is encrypted (HTTPS). Everything stored on your device (history, profile and settings) can be erased at any time with <strong>Delete all my data</strong> on the History tab.</p>
<h2>5. Person in charge of privacy</h2>
<p>Our privacy officer is responsible for protecting personal information at NutriClarté. Reach them through the <a href="#contact">contact form</a>.</p>
<h2>6. Changes</h2>
<p>If we change this policy, we will update the date above and show a notice in the app.</p>`
},

  "page.about":`
<span class="eyebrow">À propos</span>

<h2>L'histoire derrière l'application</h2>
<p>Les étiquettes nutritionnelles sont remplies de chiffres, mais elles répondent rarement à la vraie question : <em>est-ce bon pour moi ?</em> L'étiquette indique 55 g de sucre par 100 g. Est-ce beaucoup pour une personne diabétique ? Et si on n'en mange qu'une cuillère ? Et si on surveille aussi son cholestérol ?</p>

<p class="quote">Nous voulions un outil qui transforme une étiquette en réponse claire en moins de cinq secondes, dans la langue dans laquelle vous pensez.</p>
<p>C'est devenu NutriClarté : scannez un code-barres, choisissez jusqu'à trois objectifs, et obtenez un score, des alertes en langage clair et de meilleures alternatives sur la même tablette.</p>

<p>Nous sommes une petite équipe indépendante établie au Québec, qui allie le développement logiciel à une passion pour la nutrition et la santé publique. Nous n'appartenons à aucune entreprise alimentaire ni à aucune chaîne d'épiceries, et nous comptons rester ainsi.</p>

  <div class="card"><h3>La confidentialité d'abord</h3><p class="muted">Vos objectifs, votre profil et votre historique restent sur votre appareil. Nous ne vendons jamais de données.</p></div>

  "page.privacy":`
<span class="eyebrow">Confidentialité</span>
<h1>Politique de confidentialité</h1>
<p class="updated">Dernière mise à jour : 1er novembre 2026</p>
<p class="lede">En bref : vos objectifs de santé sont personnels. Nous recueillons le minimum, nous le gardons sur votre appareil autant que possible, et nous ne le vendons jamais.</p>
<h2>1. Ce que nous recueillons</h2>
<ul>
  <li><strong>Sur votre appareil seulement :</strong> les objectifs choisis, votre profil avancé (groupe d'âge, allergies) et votre historique de scans.</li>
  <li><strong>Lors d'un scan :</strong> le numéro du code-barres, envoyé à notre base de produits pour obtenir la valeur nutritive. Il n'est pas lié à votre identité.</li>
  <li><strong>Lorsque vous nous écrivez :</strong> votre nom, votre courriel et votre message, utilisés uniquement pour vous répondre.</li>
</ul>
<h2>2. Ce que nous ne faisons jamais</h2>
<ul>
  <li>Nous ne vendons, ne louons ni n'échangeons de renseignements personnels.</li>
  <li>Nous n'affichons pas de publicité et ne partageons pas de données avec les marques alimentaires.</li>
  <li>Nous ne recueillons ni votre position précise ni vos contacts.</li>
  <li>Nous ne chargeons aucun traceur, outil d'analyse ou police web de tiers. Le site charge uniquement ses propres fichiers.</li>
</ul>
<h2>3. Vos droits</h2>
<p>En vertu de la Loi 25 du Québec et de la LPRPDE du Canada, vous pouvez accéder à vos renseignements personnels, les faire corriger ou supprimer, et retirer votre consentement. Faites votre demande par le formulaire de contact en choisissant « Confidentialité ou demande de données ». Nous répondons dans un délai de 30 jours.</p>
<h2>4. Conservation et sécurité</h2>
<p>Les messages de contact sont conservés au plus 24 mois, puis supprimés. Les données en transit sont chiffrées (HTTPS). Tout ce qui est enregistré sur votre appareil (historique, profil et réglages) peut être effacé en tout temps avec <strong>Supprimer toutes mes données</strong> dans l'onglet Historique.</p>
<h2>5. Responsable de la protection des renseignements personnels</h2>
<p>Notre responsable de la protection des renseignements personnels veille à la protection de vos données chez NutriClarté. Joignez cette personne par le <a href="#contact">formulaire de contact</a>.</p>
<h2>6. Modifications</h2>
<p>Si nous modifions cette politique, nous mettrons à jour la date ci-dessus et afficherons un avis dans l'application.</p>`

  const a=[];
  if(goals.includes("lowsugar") && vals.sugars>LIMITS.sugars) a.push(["bad","!",t("alert.sugar")]);
  if(goals.includes("cardio") && vals.satfat>LIMITS.satfat) a.push(["warn","⚠",t("alert.satfat")]);
  if(goals.includes("lowsodium") && vals.sodium>LIMITS.sodium) a.push(["bad","!",t("alert.sodium")]);
  if(goals.includes("highprotein") && vals.protein<LIMITS.protein) a.push(["warn","⚠",t("alert.protein")]);
  const hits=p.allergens.filter(x=>S.profile.allergies.includes(x));
  if(hits.length) a.push(["bad","!",t("alert.allergen",{a:hits.map(x=>t("allergen."+x).toLowerCase()).join(", ")})]);
  return a;
}
function viewResult(){
  const p=prod(S.result.pid), goals=S.result.goals;
  const m=S.mode==="portion"?S.mult:1;
  const v={sugars:p.n.sugars*m,satfat:p.n.satfat*m,sodium:p.n.sodium*m,protein:p.n.protein*m};
  const alerts=computeAlerts(p,v,goals);
  const rc=ringColor(p.score);
  const filters=goals.map(goalLabel).join(" + ");
  const rankedAlts=p.alts.map(a=>({...a,fit:a.goals.filter(g=>goals.includes(g)).length}))
    .sort((x,y)=>y.fit-x.fit||y.score-x.score);
  const cell=(k,unit,dec,over)=>`<div class="${over?"over":""}"><b>${num(v[k],dec)}${unit}</b><span>${t("nut."+k)}</span></div>`;
  app.innerHTML=`<section class="view">
    <button type="button" class="btn block" id="home"><span aria-hidden="true">🏠</span>${t("res.back")}</button>
    <div class="filters"><strong>${t("res.filters")}</strong> ${esc(filters)}</div>
    <div class="seg" role="group">
      <button type="button" data-mode="base" aria-pressed="${S.mode==="base"}">${t("res.base")}</button>
      <button type="button" data-mode="portion" aria-pressed="${S.mode==="portion"}">${t("res.portion")}</button>
    </div>
    ${S.mode==="portion"?`<div class="card slider"><label for="mult"><span>${t("res.adjust",{m:fmtMult(S.mult)})}</span><span class="muted">${t("res.grams",{g:Math.round(S.mult*100)})}</span></label>
      <input id="mult" type="range" min="0.1" max="3" step="0.1" value="${S.mult}" aria-valuetext="x${S.mult}"></div>`:""}
    <div class="card" style="--rc:${rc}">
      <div class="score"><div class="ring" aria-label="${p.score}/100">${p.score}</div>
        <div><div class="pname">${esc(p.name[S.lang])}</div><div class="rating">${t("rating."+rating(p.score))}</div></div></div>
      <div class="alerts">${alerts.length?alerts.map(a=>`<div class="alert ${a[0]}"><i aria-hidden="true">${a[1]}</i><span>${a[2]}</span></div>`).join("")
        :`<div class="alert good"><i aria-hidden="true">✓</i><span>${t("res.matches")}</span></div>`}</div>
    </div>
    <div class="label">${t("res.bio")}</div>
    <div class="card nutr">
      ${cell("sugars","g",1,goals.includes("lowsugar")&&v.sugars>LIMITS.sugars)}
      ${cell("satfat","g",1,goals.includes("cardio")&&v.satfat>LIMITS.satfat)}
      ${cell("sodium","mg",0,goals.includes("lowsodium")&&v.sodium>LIMITS.sodium)}
      ${cell("protein","g",1,goals.includes("highprotein")&&v.protein<LIMITS.protein)}
    </div>
    <div class="label"><span aria-hidden="true">✨</span> ${t("res.alts")}</div>
    ${rankedAlts.map(a=>`<div class="card alt">
      <div class="head"><h3>${esc(a.name)}</h3><span class="pill">${a.score}/100</span></div>
      <p class="why">${esc(a.why[S.lang])}</p>
      ${a.fit&&!goals.includes("standard")?`<span class="match">✓ ${t("res.fits")}</span>`:""}
      <div class="tags"><span>${t("nut.sugars")}: ${num(a.n.sugars*m,1)}g</span><span>${t("nut.satfat")}: ${num(a.n.satfat*m,1)}g</span><span>${t("nut.sodium")}: ${num(a.n.sodium*m,0)}mg</span><span>${t("nut.protein")}: ${num(a.n.protein*m,1)}g</span></div>
    </div>`).join("")}
  </section>`;
  $("#home").addEventListener("click",()=>{ S.result=null; render(); window.scrollTo(0,0); });
  app.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{ S.mode=b.dataset.mode; viewResult(); }));
  const r=$("#mult"); if(r) r.addEventListener("input",()=>{ S.mult=Math.round(parseFloat(r.value)*10)/10; viewResult(); const n=$("#mult"); n&&n.focus(); });
}

function viewHistory(){
  app.innerHTML=`<section class="view">
    <div><h1 style="font-size:1.6rem">${t("hist.title")}</h1><p class="muted">${t("hist.lede")}</p></div>
    <div class="hist">${S.history.length?S.history.map((h,i)=>{ const p=prod(h.pid); return `
      <button type="button" class="card hrow" data-i="${i}" style="--rc:${ringColor(p.score)}">
        <span class="ring">${p.score}</span>
        <div><strong>${esc(p.name[S.lang])}</strong>${h.example?`<span class="ex">${t("hist.example")}</span>`:""}<br>
        <small>${when(h.t)} · ${esc(h.goals.map(goalLabel).join(" + "))}</small></div>
      </button>`;}).join(""):`<div class="card muted">${t("hist.empty")}</div>`}</div>
    ${S.history.length?`<div><button type="button" class="btn ghost" id="clear">${t("hist.clear")}</button></div>`:""}
    <div class="card danger">
      <h2 style="font-size:1.1rem">${t("data.title")}</h2>
      <p class="muted">${t("data.desc")}</p>
      ${S.confirmDelete?`<p role="alert" style="font-weight:600">${t("data.confirm")}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn red" id="delyes">${t("data.yes")}</button><button type="button" class="btn ghost" id="delno">${t("data.no")}</button></div>`
      :`<div><button type="button" class="btn red" id="delall">${t("data.delete")}</button></div>`}
    </div>
  </section>`;
  const da=$("#delall"); if(da) da.addEventListener("click",()=>{ S.confirmDelete=true; viewHistory(); $("#delyes").focus(); });
  const dn=$("#delno"); if(dn) dn.addEventListener("click",()=>{ S.confirmDelete=false; viewHistory(); });
  const dy=$("#delyes"); if(dy) dy.addEventListener("click",()=>{
    store.wipe();
    S.history=[]; S.profile=cleanProfile(null); S.goals=["standard"]; S.result=null; S.contactSent=null; S.confirmDelete=false;
    render(); toast(t("data.deleted"));
  });
  app.querySelectorAll("[data-i]").forEach(b=>b.addEventListener("click",()=>{ const h=S.history[+b.dataset.i]; showResult(h.pid,h.goals,false); }));
  const c=$("#clear"); if(c) c.addEventListener("click",()=>{ S.history=[]; store.set("history",[]); viewHistory(); toast(t("hist.cleared")); });
}

function viewFaq(){
  app.innerHTML=`<section class="view"><h1 style="font-size:1.6rem">${t("faq.title")}</h1>
    <div>${t("faq").map((q,i)=>`<details${i===0?" open":""}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}</div>
    <p class="muted"><a href="#support">${t("tab.support")}</a> · <a href="#contact">${t("tab.contact")}</a></p></section>`;
}

function viewPage(r){ app.innerHTML=`<article class="view prose">${t("page."+r)}</article>`; }

function viewContact(){
  const topics=["general","support","privacy","partner"];
  const sent=S.contactSent;
  const prev=$("#cform")?{n:$("#c-name").value,e:$("#c-email").value,tp:$("#c-topic").value,m:$("#c-msg").value,c:$("#c-consent").checked}:null;
  app.innerHTML=`<section class="view">
    <div class="prose"><span class="eyebrow">${t("contact.eyebrow")}</span><h1>${t("contact.title")}</h1><p class="lede">${t("contact.lede")}</p></div>
    <div class="contact">
      <div class="card">${sent?`<div class="success" role="status">
          <h3>${esc(t("ok.title",{name:sent.name}))}</h3>
          <p>${esc(t("ok.body",{topic:t("topic."+sent.topic),email:sent.email}))}</p>
          <p class="muted" style="font-size:.88rem">${t("ok.demo")}</p>
          <div><button type="button" class="btn ghost" id="again">${t("ok.again")}</button></div></div>`
      :`<form id="cform" novalidate>
        <div class="field"><label for="c-name">${t("f.name")}</label><input id="c-name" name="name" autocomplete="name" required><span class="err" id="e-name"></span></div>
        <div class="field"><label for="c-email">${t("f.email")}</label><input id="c-email" name="email" type="email" autocomplete="email" required><span class="err" id="e-email"></span></div>
        <div class="field"><label for="c-topic">${t("f.topic")}</label><select id="c-topic" name="topic">${topics.map(x=>`<option value="${x}">${t("topic."+x)}</option>`).join("")}</select></div>
        <div class="field"><label for="c-msg">${t("f.message")}</label><textarea id="c-msg" name="message" required></textarea><span class="err" id="e-message"></span></div>
        <label class="check"><input type="checkbox" id="c-consent"><span>${t("f.consent")}</span></label><span class="err" id="e-consent" style="color:var(--bad);font-size:.85rem"></span>
        <button type="submit" class="btn">${t("f.send")}</button>
      </form>`}</div>
      <aside class="side">
        <div class="card"><span class="label">${t("c.call")}</span><span class="phone" id="phone">${PHONE}</span><span class="muted">${t("c.hours")}</span>
          <button type="button" class="copy" id="copy">${t("c.copy")}</button></div>
        <div class="card"><span class="label">${t("c.reply")}</span><span>${t("c.replyv")}</span></div>
        <div class="card"><span class="label">${t("c.where")}</span><span>${t("c.place")}</span></div>
      </aside>
    </div></section>`;
  $("#copy").addEventListener("click",()=>{
    const ok=()=>toast(t("c.copied"));
    try{ navigator.clipboard.writeText(PHONE).then(ok,()=>selectPhone()); }catch(e){ selectPhone(); }
  });
  const again=$("#again"); if(again) again.addEventListener("click",()=>{ S.contactSent=null; viewContact(); });
  const f=$("#cform"); if(!f) return;
  if(prev){ $("#c-name").value=prev.n; $("#c-email").value=prev.e; $("#c-topic").value=prev.tp; $("#c-msg").value=prev.m; $("#c-consent").checked=prev.c; }
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const d={name:$("#c-name").value.trim(),email:$("#c-email").value.trim(),topic:$("#c-topic").value,message:$("#c-msg").value.trim(),consent:$("#c-consent").checked};
    const errs={name:!d.name&&t("err.name"),email:!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)&&t("err.email"),message:d.message.length<10&&t("err.message"),consent:!d.consent&&t("err.consent")};
    let first=null;
    for(const k in errs){ $("#e-"+k).textContent=errs[k]||""; if(errs[k]&&!first) first=k; }
    if(first){ ({name:"#c-name",email:"#c-email",message:"#c-msg",consent:"#c-consent"})[first] && $(({name:"#c-name",email:"#c-email",message:"#c-msg",consent:"#c-consent"})[first]).focus(); return; }
    // Production: POST `d` to your form endpoint here (e.g. Formspree, Netlify Forms or your own API).
    S.contactSent=d; viewContact(); window.scrollTo(0,0);
  });
}
function selectPhone(){ const r=document.createRange(); r.selectNodeContents($("#phone")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

function openProfile(){
  const P=S.profile, al=["nuts","peanuts","milk","gluten","soy"];
  layer.innerHTML=`<div class="modal" id="pm"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pt">
    <h2 id="pt">${t("profile.title")}</h2><p class="muted">${t("profile.desc")}</p>
    <div class="field"><label for="p-age">${t("profile.age")}</label><select id="p-age">${["1","2","3"].map(x=>`<option value="${x}"${P.age===x?" selected":""}>${t("age."+x)}</option>`).join("")}</select></div>
    <div class="field"><span style="font-weight:600">${t("profile.allergies")}</span><div class="opts">${al.map(x=>`<button type="button" class="chip" data-al="${x}" aria-pressed="${P.allergies.includes(x)}">${t("allergen."+x)}</button>`).join("")}</div></div>
    <div class="row"><button type="button" class="btn ghost" id="pc">${t("profile.cancel")}</button><button type="button" class="btn" id="ps">${t("profile.save")}</button></div>
  </div></div>`;
  layer.querySelectorAll("[data-al]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"))));
  $("#pc").addEventListener("click",()=>layer.innerHTML="");
  $("#pm").addEventListener("click",e=>{ if(e.target.id==="pm") layer.innerHTML=""; });
  $("#ps").addEventListener("click",()=>{
    S.profile={age:$("#p-age").value,allergies:[...layer.querySelectorAll('[data-al][aria-pressed="true"]')].map(b=>b.dataset.al)};
    store.set("profile",S.profile); layer.innerHTML=""; toast(t("profile.saved"));
  });
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") layer.innerHTML=""; });

render();

</script>
